name: Build Firecracker Kernel

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: build-firecracker-kernel
  cancel-in-progress: false

jobs:
  build:
    name: Build x86_64 vmlinux
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio curl dwarves flex git jq \
            libelf-dev libssl-dev rsync xz-utils zstd

      - name: Resolve latest stable kernel and Firecracker config
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KERNEL_VERSION=$(curl -fsSL https://www.kernel.org/releases.json | jq -r '.latest_stable.version')
          CONFIG_NAME=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/firecracker-microvm/firecracker/contents/resources/guest_configs \
            | jq -r '.[].name' \
            | grep -E '^microvm-kernel-ci-x86_64-[0-9]+(\.[0-9]+)*\.config$' \
            | sort -V \
            | tail -n 1)

          test -n "${KERNEL_VERSION}"
          test -n "${CONFIG_NAME}"

          echo "kernel_version=${KERNEL_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "config_name=${CONFIG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "Latest stable kernel: ${KERNEL_VERSION}"
          echo "Latest Firecracker config: ${CONFIG_NAME}"

      - name: Check for an existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_VERSION: ${{ steps.versions.outputs.kernel_version }}
        run: |
          TAG="v${KERNEL_VERSION}-firecracker"
          ASSETS=$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if grep -qx 'vmlinux' <<< "${ASSETS}" && grep -qx 'vmlinux-podman' <<< "${ASSETS}"; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Release ${TAG} already contains vmlinux and vmlinux-podman; skipping build."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "Release ${TAG} is missing one or both assets; build will run."
          fi

      - name: Download and extract kernel source
        if: steps.release.outputs.exists != 'true'
        env:
          KERNEL_VERSION: ${{ steps.versions.outputs.kernel_version }}
        run: |
          KERNEL_SERIES="${KERNEL_VERSION%%.*}.x"
          curl -fsSL "https://cdn.kernel.org/pub/linux/kernel/v${KERNEL_SERIES}/linux-${KERNEL_VERSION}.tar.xz" -o linux.tar.xz
          tar -xf linux.tar.xz
          rm linux.tar.xz
          echo "KERNEL_DIR=linux-${KERNEL_VERSION}" >> "${GITHUB_ENV}"

      - name: Download latest Firecracker kernel config
        if: steps.release.outputs.exists != 'true'
        env:
          CONFIG_NAME: ${{ steps.versions.outputs.config_name }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/firecracker-microvm/firecracker/main/resources/guest_configs/${CONFIG_NAME}" -o firecracker.config

      - name: Configure podman kernel
        if: steps.release.outputs.exists != 'true'
        run: |
          BUILD_DIR="${PWD}/build-podman"
          mkdir -p "${BUILD_DIR}"
          cp firecracker.config "${BUILD_DIR}/.config"
          cat >> "${BUILD_DIR}/.config" <<'EOF'
          CONFIG_MODULES=n
          # Options required for graceful shutdown via API
          CONFIG_INPUT=y
          CONFIG_INPUT_KEYBOARD=y
          CONFIG_KEYBOARD_ATKBD=y
          CONFIG_SERIO=y
          CONFIG_SERIO_I8042=y
          # Options to enable podman rootful networking
          CONFIG_NFT_MASQ=y
          CONFIG_NFT_FIB=y
          CONFIG_NFT_FIB_INET=y
          CONFIG_NFT_FIB_IPV4=y
          CONFIG_NFT_FIB_IPV6=y
          CONFIG_NF_TABLES_INET=y
          EOF
          make -C "${KERNEL_DIR}" O="${BUILD_DIR}" olddefconfig

          for option in CONFIG_NFT_MASQ CONFIG_NFT_FIB CONFIG_NFT_FIB_INET CONFIG_NFT_FIB_IPV4 CONFIG_NFT_FIB_IPV6 CONFIG_NF_TABLES_INET; do
            grep -q "^${option}=y$" "${BUILD_DIR}/.config" || { echo "${option} was not enabled"; exit 1; }
          done

          if grep -q '^CONFIG_MODULES=y$' "${BUILD_DIR}/.config"; then
            echo "CONFIG_MODULES was not disabled"
            exit 1
          fi

      - name: Compile podman kernel
        if: steps.release.outputs.exists != 'true'
        run: |
          BUILD_DIR="${PWD}/build-podman"
          make -C "${KERNEL_DIR}" O="${BUILD_DIR}" -j"$(nproc)" vmlinux
          cp "${BUILD_DIR}/vmlinux" vmlinux-podman

      - name: Configure default kernel
        if: steps.release.outputs.exists != 'true'
        run: |
          BUILD_DIR="${PWD}/build-default"
          mkdir -p "${BUILD_DIR}"
          cp firecracker.config "${BUILD_DIR}/.config"
          cat >> "${BUILD_DIR}/.config" <<'EOF'
          CONFIG_MODULES=n
          # Options required for graceful shutdown via API
          CONFIG_INPUT=y
          CONFIG_INPUT_KEYBOARD=y
          CONFIG_KEYBOARD_ATKBD=y
          CONFIG_SERIO=y
          CONFIG_SERIO_I8042=y
          EOF
          make -C "${KERNEL_DIR}" O="${BUILD_DIR}" olddefconfig

          if grep -q '^CONFIG_MODULES=y$' "${BUILD_DIR}/.config"; then
            echo "CONFIG_MODULES was not disabled"
            exit 1
          fi

      - name: Compile default kernel
        if: steps.release.outputs.exists != 'true'
        run: |
          BUILD_DIR="${PWD}/build-default"
          make -C "${KERNEL_DIR}" O="${BUILD_DIR}" -j"$(nproc)" vmlinux
          cp "${BUILD_DIR}/vmlinux" vmlinux

      - name: Upload default vmlinux workflow artifact
        if: steps.release.outputs.exists != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vmlinux-${{ steps.versions.outputs.kernel_version }}
          path: vmlinux
          if-no-files-found: error

      - name: Upload podman vmlinux workflow artifact
        if: steps.release.outputs.exists != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vmlinux-podman-${{ steps.versions.outputs.kernel_version }}
          path: vmlinux-podman
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.versions.outputs.kernel_version }}-firecracker
          name: Linux ${{ steps.versions.outputs.kernel_version }} (Firecracker)
          body: |
            Linux kernel **${{ steps.versions.outputs.kernel_version }}** compiled from the official kernel.org source with the latest Firecracker kernel config (`${{ steps.versions.outputs.config_name }}`).

            Assets:

            - `vmlinux`: base Firecracker config with the following extra kernel options:

            ```text
            CONFIG_MODULES=n
            CONFIG_INPUT=y
            CONFIG_INPUT_KEYBOARD=y
            CONFIG_KEYBOARD_ATKBD=y
            CONFIG_SERIO=y
            CONFIG_SERIO_I8042=y
            ```

            - `vmlinux-podman`: base Firecracker config with the following extra kernel options to support rootful podman:

            ```text
            CONFIG_MODULES=n
            CONFIG_INPUT=y
            CONFIG_INPUT_KEYBOARD=y
            CONFIG_KEYBOARD_ATKBD=y
            CONFIG_SERIO=y
            CONFIG_SERIO_I8042=y
            CONFIG_NFT_MASQ=y
            CONFIG_NFT_FIB=y
            CONFIG_NFT_FIB_INET=y
            CONFIG_NFT_FIB_IPV4=y
            CONFIG_NFT_FIB_IPV6=y
            CONFIG_NF_TABLES_INET=y
            ```
          files: |
            vmlinux
            vmlinux-podman
          preserve_order: true
          fail_on_unmatched_files: true
